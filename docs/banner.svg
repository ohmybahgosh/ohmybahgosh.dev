<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">ohmybahgosh.dev</title>
  <desc id="d">A terminal prompt typing cd ~/repos, followed by the site name ohmybahgosh.dev and the tagline: software LG forgot to ship.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#33e1ff"/>
      <stop offset="1" stop-color="#8b5cff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="0%" r="60%">
      <stop offset="0" stop-color="#33e1ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#33e1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0%" cy="100%" r="60%">
      <stop offset="0" stop-color="#8b5cff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8b5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="type"><rect x="248" y="96" height="40" width="0">
      <animate attributeName="width" from="0" to="170" dur="1.4s" begin="0.4s" fill="freeze" calcMode="discrete" values="0;16;32;48;64;80;96;112;128;144;160;170" keyTimes="0;.09;.18;.27;.36;.45;.54;.63;.72;.81;.9;1"/>
    </rect></clipPath>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .s{font-family:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .fade{opacity:0;animation:in .8s ease forwards}
      .d1{animation-delay:2s}.d2{animation-delay:2.4s}.d3{animation-delay:2.8s}
      @keyframes in{to{opacity:1}}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1}.cur{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="360" rx="20" fill="#05070d"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glow1)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glow2)"/>
  <rect x=".5" y=".5" width="1279" height="359" rx="19.5" fill="none" stroke="#1b2440"/>

  <g transform="translate(64 44)">
    <circle cx="8" cy="8" r="7" fill="#ff5f57"/><circle cx="30" cy="8" r="7" fill="#febc2e"/><circle cx="52" cy="8" r="7" fill="#28c840"/>
    <text x="1152" y="13" text-anchor="end" class="m" font-size="14" fill="#5d6a8f">root@ohmybahgosh: ~</text>
  </g>

  <text x="64" y="124" class="m" font-size="26" fill="#3ddc97">root@omb<tspan fill="#9aa6c8">:</tspan><tspan fill="#33e1ff">~</tspan><tspan fill="#e8eeff">#</tspan></text>
  <text x="252" y="124" class="m" font-size="26" fill="#e8eeff" clip-path="url(#type)">cd ~/repos</text>
  <rect class="cur" x="414" y="102" width="14" height="28" fill="#33e1ff"/>

  <text x="62" y="222" class="s fade d1" font-size="78" font-weight="700" fill="#ffffff" letter-spacing="-2">ohmybahgosh<tspan fill="url(#g)">.dev</tspan></text>
  <text x="66" y="272" class="s fade d2" font-size="26" fill="#9aa6c8">Software LG forgot to ship.  Open-source projects, starting with webOS homebrew.</text>
  <g class="fade d3 m" font-size="16" fill="#9aa6c8">
    <rect x="64" y="298" width="128" height="34" rx="8" fill="#ffffff" fill-opacity=".03" stroke="#27325a"/><text x="80" y="320"><tspan fill="#33e1ff">▸</tspan> TiviBro</text>
    <rect x="204" y="298" width="178" height="34" rx="8" fill="#ffffff" fill-opacity=".03" stroke="#27325a"/><text x="220" y="320"><tspan fill="#3ddc97">▸</tspan> LG-USB-2-ETH0</text>
    <rect x="394" y="298" width="248" height="34" rx="8" fill="#ffffff" fill-opacity=".03" stroke="#27325a"/><text x="410" y="320"><tspan fill="#ff3ea5">▸</tspan> Entware Installer</text>
  </g>
</svg>
