name: Deploy site

# Rebuilds the site data from GitHub (versions, releases, commits, stars) and
# publishes to GitHub Pages: on every push, every 3 hours, or on demand.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live repo data
        continue-on-error: true   # the site falls back to the GitHub API in the browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update-data.py data/repos.json
      - name: Browser-friendly copy of the Homebrew repo
        # /repo has no extension, so browsers get it as a download.  /repo.json is
        # the same file served as JSON, for viewing it in a browser.
        run: cp repo repo.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
