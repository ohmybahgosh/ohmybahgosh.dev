name: Deploy site

# Rebuilds the site data from GitHub (versions, releases, commits, stars) and
# publishes to GitHub Pages: on every push, every 3 hours, or on demand.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live repo data
        continue-on-error: true   # the site falls back to the GitHub API in the browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update-data.py data/repos.json
      - name: Special thanks on project pages
        continue-on-error: true   # keeps the committed list if GitHub is unreachable
        run: python3 tools/gen-thanks.py
      - name: Draw the README badges
        continue-on-error: true   # keeps the committed badges if the data step failed
        run: python3 tools/make-badges.py data/repos.json badges
      - name: Refresh the Luna Atlas catalog
        continue-on-error: true   # keeps the committed copy if GitHub is unreachable
        run: |
          curl -fsSL --retry 3 -o /tmp/catalog.json https://raw.githubusercontent.com/ohmybahgosh/WEBOS-LUNA-SEND-ATLAS/main/web/catalog.json
          python3 -c "import json,sys; d=json.load(open('/tmp/catalog.json')); assert len(d['services']) > 100 and d['counts']['methods'] > 1000"
          mv /tmp/catalog.json luna-atlas/catalog.json
      - name: Rebuild the Luna Atlas category pages and the sitemap
        continue-on-error: true   # keeps the committed pages if this fails
        run: python3 tools/build-luna-pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
