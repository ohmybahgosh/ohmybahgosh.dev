name: Link check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"   # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in pages and README
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --no-progress
            --max-concurrency 8
            --accept 200,204,206,429
            --root-dir ${{ github.workspace }}
            --exclude '^https://api\.github\.com'
            --exclude 'TV_IP'
            --exclude '^http://localhost'
            --exclude '^https://ohmybahgosh\.dev'
            './**/*.html' README.md
