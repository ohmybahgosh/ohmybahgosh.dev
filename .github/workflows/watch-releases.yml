name: Watch releases

# Safety net for release-triggered updates: every 15 minutes, compare each
# project's newest release (and the Entware script's VERSION) with what the live
# site shows.  If anything is newer, rebuild the Homebrew repo and redeploy.
# Projects can also notify the site instantly (see notify-site.yml in each repo).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: watch-releases
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare GitHub with the live site
        id: cmp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          tok = os.environ["GH_TOKEN"]
          def get(url, raw=False):
              h = {"User-Agent": "ohmybahgosh.dev-watch", "Authorization": f"Bearer {tok}"}
              h["Accept"] = "application/vnd.github.raw" if raw else "application/vnd.github+json"
              with urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=30) as r:
                  b = r.read().decode()
                  return b if raw else json.loads(b)
          try:
              with urllib.request.urlopen("https://ohmybahgosh.dev/data/repos.json", timeout=30) as r:
                  live = json.load(r)["repos"]
          except Exception as e:
              print("live data unreadable:", e); live = {}
          stale = []
          for name, vfile in {"TiviBro": None, "LG-USB-2-ETH0": None, "WEBOS-ENTWARE-INSTALLER": "webos-entware-installer.sh"}.items():
              rels = [r for r in get(f"https://api.github.com/repos/ohmybahgosh/{name}/releases?per_page=20") if not r.get("draft")]
              rels.sort(key=lambda r: r.get("published_at") or r.get("created_at") or "", reverse=True)   # GitHub's order isn't newest first
              tag = rels[0]["tag_name"] if rels else None
              if not tag and vfile:
                  m = re.search(r'^\s*VERSION="?([0-9][^"\s]*)', get(f"https://api.github.com/repos/ohmybahgosh/{name}/contents/{vfile}", raw=True), re.M)
                  tag = "v" + m.group(1) if m else None
              shown = (live.get(name) or {}).get("tag")
              print(f"{name}: GitHub {tag} · site {shown}")
              if tag and tag != shown:
                  stale.append(name)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"stale={' '.join(stale)}\n")
          PY

      - name: Rebuild and redeploy
        if: steps.cmp.outputs.stale != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Out of date: ${{ steps.cmp.outputs.stale }}"
          gh workflow run homebrew-repo.yml -R "$GITHUB_REPOSITORY" -f deploy=true
