name: Homebrew repo

# Rebuilds https://ohmybahgosh.dev/repo (the Homebrew Channel repository) from the
# latest release manifests listed in homebrew/sources.json, on a schedule, when a
# project announces a release, or when the release watcher spots one.  Commits only when
# something changed (the commit is made through the GitHub API, so it's signed and
# Verified), then redeploys the site.
on:
  schedule:
    - cron: "13 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: Redeploy the site even if the repo file didn't change
        type: boolean
        default: false
  repository_dispatch:
    types: [release]   # sent by each project's notify-site.yml when it publishes a release

permissions:
  contents: write
  actions: write

concurrency:
  group: homebrew-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the repository file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build-hb-repo.py repo

      - name: Commit if it changed
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- repo)" ]; then
            echo "No change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --stat -- repo
          python3 - <<'PY' > payload.json
          import base64, json, os, subprocess
          repo = json.load(open("repo"))
          versions = ", ".join(f"{p['title']} {p['manifest']['version']}" for p in repo["packages"])
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          print(json.dumps({
              "query": "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              "variables": {"input": {
                  "branch": {"repositoryNameWithOwner": os.environ["GITHUB_REPOSITORY"], "branchName": os.environ["GITHUB_REF_NAME"]},
                  "expectedHeadOid": head,
                  "message": {"headline": f"Homebrew repo: {versions}"},
                  "fileChanges": {"additions": [{"path": "repo", "contents": base64.b64encode(open("repo", "rb").read()).decode()}]},
              }},
          }))
          PY
          gh api graphql --input payload.json --jq '.data.createCommitOnBranch.commit.url'
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'repository_dispatch' || inputs.deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
